name: Publicar web (iOS)

# Publica web/ en GitHub Pages: https://matiasacc.github.io/toma_tiempos/
# Requiere una sola vez: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar sitio
        run: |
          mkdir -p sitio
          cp -r web/* sitio/
          cp sitio/toma_tiempos.html sitio/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deploy
        uses: actions/deploy-pages@v4
