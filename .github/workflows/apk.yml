name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión
        id: ver
        run: |
          H=$(grep -oP "const VERSION='\K[^']+" web/toma_tiempos.html)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            if [ "$H" != "$V" ]; then
              echo "::error::VERSION del HTML ($H) no coincide con el tag ($V)"; exit 1
            fi
          else
            V="$H-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease -PvCode=${{ github.run_number }} -PvName=${{ steps.ver.outputs.name }} --no-daemon --stacktrace

      - name: Preparar archivos
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/toma_tiempos-${{ steps.ver.outputs.name }}.apk"
          cp web/toma_tiempos.html "out/toma_tiempos-${{ steps.ver.outputs.name }}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: toma_tiempos-${{ steps.ver.outputs.name }}
          path: out/*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
