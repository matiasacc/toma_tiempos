name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Si VERSION del HTML todavía no tiene release (tag v<VERSION>), esta corrida la publica.
      # Si ya existe, compila igual una APK de prueba (-dev) que queda en Artifacts.
      - name: Versión
        id: ver
        run: |
          H=$(grep -oP "const VERSION='\K[^']+" web/toma_tiempos.html)
          if [ -z "$H" ]; then echo "::error::No se encontró const VERSION en el HTML"; exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            if [ "$H" != "$V" ]; then echo "::error::VERSION del HTML ($H) no coincide con el tag ($V)"; exit 1; fi
            PUB=true
          elif git ls-remote --exit-code --tags origin "refs/tags/v$H" >/dev/null; then
            V="$H-dev.${GITHUB_RUN_NUMBER}"; PUB=false
          else
            V="$H"; PUB=true
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "publicar=$PUB" >> "$GITHUB_OUTPUT"
          echo "tag=v$H" >> "$GITHUB_OUTPUT"
          echo "Versión: $V · publicar release: $PUB"

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease -PvCode=${{ github.run_number }} -PvName=${{ steps.ver.outputs.name }} --no-daemon --stacktrace

      - name: Preparar archivos
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/toma_tiempos-${{ steps.ver.outputs.name }}.apk"
          cp web/toma_tiempos.html "out/toma_tiempos-${{ steps.ver.outputs.name }}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: toma_tiempos-${{ steps.ver.outputs.name }}
          path: out/*

      - name: Publicar release
        if: steps.ver.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Toma de Tiempos ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
